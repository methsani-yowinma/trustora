[project]
name = "trustora-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "E501"]  # Depends() in defaults; line length is left to `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Live Gemini tests (tests/test_live_gemini.py) only run when asked for: pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY)"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine resumes code inside greenlets; without this, lines after a database
# call are reported as not covered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_covered = true
show_missing = true
